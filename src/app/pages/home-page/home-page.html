<section class="hero" aria-label="Hero Sala de juegos">
  <div class="hero__bg-overlay"></div>
  <div class="hero__content container">
    <div class="hero__eyebrow">
      <span class="hero__tag">Trabajo práctico</span>
    </div>

    <h1 class="hero__title">
      <span class="hero__title-line">Sala de</span>
      <span class="hero__title-line hero__title-line--accent">Juegos</span>
    </h1>

    <p class="hero__subtitle">LEANDRO GUIA</p>

    <div class="hero__divider" aria-hidden="true"></div>
  </div>

  <div class="hero__scroll-indicator" aria-hidden="true">
    <span class="hero__scroll-line"></span>
  </div>
</section>

<main class="games-section" id="juegos">
  <div class="container">
    @if (currentUser()) {
      <div class="games-section__header">
        <h2 class="games-section__title">Juegos disponibles</h2>
        <p class="games-section__desc">Seleccioná un juego para comenzar</p>
      </div>

      <div class="games-grid" role="list">
        @for (game of gameList; track game.url) {
          <app-game-cards-component [game]="game" />
        }
      </div>
    } @else {
      <div class="games-section__header">
        <h2 class="games-section__title">Juegos disponibles</h2>
      </div>

      <div class="games-empty">
        <h2 class="games-section__title">SÓLO PARA USUARIOS REGISTRADOS</h2>
        <button
          class="btn btn-primary"
          routerLink="/session/login"
          routerLinkActive="active"
          [routerLinkActiveOptions]="{ exact: true }"
        >
          Ingresar y comenzar a jugar
        </button>
      </div>
    }
    <footer class="site-footer">
      <div class="container">
        <p class="site-footer__text">
          Hecho por
          <span class="site-footer__author"
            ><a target="_blank" href="https://github.com/leanx22">Leandro Guia</a></span
          >
        </p>
      </div>
    </footer>
  </div>
</main>
