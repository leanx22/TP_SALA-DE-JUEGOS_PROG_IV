@if(userData()){
  <div class="card-body rounded-pill p-5 p-sm-1 d-flex flex-column flex-sm-row align-items-center shadow">
    <img
      src="{{ userData()?.avatar_url }}"
      class="rounded-pill profile-picture ms-0"
      alt="user profile picture"
    />
    <div class="ms-0 ms-sm-4 text-center text-sm-start">
      <h1>{{ fullName }}</h1>
      <h4>{{ userData()?.login }}</h4>
    </div>
  </div>

  <div class="card-body rounded-pill mt-2 d-flex align-items-center shadow p-3">
    <div class="text-center text-sm-start ms-sm-4">
      <h2>Sobre mí</h2>
      <p>{{ userData()?.bio }}</p>
    </div>
  </div>
} @else {
  <div class="card-body rounded-top-4 p-3 d-flex align-items-center shadow placeholder-glow">
    <div
      class="placeholder rounded-pill profile-picture flex-shrink-0"
      style="width: 175px; height: 175px;"
    ></div>
    <div class="ms-4 w-100">
      <h1 class="mb-2" style="line-height: 1;">
        <span class="placeholder rounded d-block" style="width: 55%; height: 1em;"></span>
      </h1>
      <h4 class="mb-0" style="line-height: 1;">
        <span class="placeholder rounded d-block" style="width: 35%; height: 1em;"></span>
      </h4>
    </div>
  </div>

  <div class="card-body rounded-bottom p-3 shadow placeholder-glow">
    <div class="ms-4">
      <h2 style="line-height: 1;">
        <span class="placeholder rounded d-block" style="width: 15%; height: 1em;"></span>
      </h2>
      <p class="mb-0 d-flex flex-column gap-1">
        <span class="placeholder rounded d-block" style="width: 100%; height: 1em;"></span>
        <span class="placeholder rounded d-block" style="width: 80%; height: 1em;"></span>
        <span class="placeholder rounded d-block" style="width: 90%; height: 1em;"></span>
      </p>
    </div>
  </div>
}
