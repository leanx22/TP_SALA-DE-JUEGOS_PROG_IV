@if (card) {
  <div class="playing-card">
    <div class="card-corner top-left">
      <span class="value">{{ valorDisplay }}</span>
      <span class="suit">{{ emoji }}</span>
    </div>
    
    <div class="card-center">
      <span class="suit-main">{{ emoji }}</span>
    </div>
    
    <div class="card-corner bottom-right">
      <span class="value">{{ valorDisplay }}</span>
      <span class="suit">{{ emoji }}</span>
    </div>
  </div>
}
