<div class="display-container">
  <div class="image-wrapper">
    <svg width="200" height="250" viewBox="0 0 200 250" xmlns="http://www.w3.org/2000/svg">
      <!-- Base and Pole (always visible) -->
      <line x1="20" y1="230" x2="180" y2="230" stroke="currentColor" stroke-width="4"/>
      <line x1="100" y1="230" x2="100" y2="20" stroke="currentColor" stroke-width="4"/>
      <line x1="100" y1="20" x2="150" y2="20" stroke="currentColor" stroke-width="4"/>
      <line x1="150" y1="20" x2="150" y2="50" stroke="currentColor" stroke-width="4"/>

      <!-- Head -->
      @if (errors() >= 1) {
        <circle cx="150" cy="70" r="20" stroke="currentColor" stroke-width="4" fill="none"/>
      }
      
      <!-- Torso -->
      @if (errors() >= 2) {
        <line x1="150" y1="90" x2="150" y2="150" stroke="currentColor" stroke-width="4"/>
      }

      <!-- Left Arm -->
      @if (errors() >= 3) {
        <line x1="150" y1="100" x2="120" y2="130" stroke="currentColor" stroke-width="4"/>
      }

      <!-- Right Arm -->
      @if (errors() >= 4) {
        <line x1="150" y1="100" x2="180" y2="130" stroke="currentColor" stroke-width="4"/>
      }

      <!-- Left Leg -->
      @if (errors() >= 5) {
        <line x1="150" y1="150" x2="120" y2="190" stroke="currentColor" stroke-width="4"/>
      }

      <!-- Right Leg -->
      @if (errors() >= 6) {
        <line x1="150" y1="150" x2="180" y2="190" stroke="currentColor" stroke-width="4"/>
      }
    </svg>
  </div>
  
  <div class="word-wrapper">
    @for (char of displayWord(); track $index) {
      <span class="letter-box" [class.is-empty]="char === '_'">
        {{ char === '_' ? '' : char }}
      </span>
    }
  </div>
</div>
